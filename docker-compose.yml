services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: chatapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp -d chatapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
   build:
     context: ./back-end
     dockerfile: Dockerfile
   ports:
     - "4000:4000"
   env_file:
     - ./back-end/.env
   environment:
     PORT: 4000
     HOST: 0.0.0.0
  
     DB_HOST: postgres
     DB_PORT: 5432
  
     REDIS_HOST: redis
     REDIS_PORT: 6379
  
     MINIO_ENDPOINT: minio
     MINIO_PORT: 9000
   depends_on:
     postgres:
       condition: service_healthy
     redis:
       condition: service_started
     minio:
       condition: service_started

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
volumes:
  pgdata:
  minio_data:
